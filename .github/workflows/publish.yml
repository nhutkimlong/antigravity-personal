name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: |
          rm -f *.vsix
          npx @vscode/vsce package --no-dependencies

      # ==========================================
      # Tạo GitHub Release và đính kèm file .vsix
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Tùy chọn: Publish lên VS Code Marketplace nếu có token
      # ==========================================
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        continue-on-error: true
        run: npx @vscode/vsce publish -i *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # ==========================================
      # Tùy chọn: Publish lên Open VSX nếu có token
      # ==========================================
      - name: Publish to Open VSX Registry
        if: env.OPEN_VSX_TOKEN != ''
        continue-on-error: true
        run: npx ovsx publish *.vsix --pat ${{ secrets.OPEN_VSX_TOKEN }}
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
